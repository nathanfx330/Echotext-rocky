# .github/workflows/rocky-linux.yml
name: Rocky Linux 8 CPU build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rocky-linux:
    runs-on: ubuntu-24.04
    container: rockylinux:8
    steps:
      # Ninja is supplied by Rocky 8 PowerTools, disabled by default.
      - name: Install native dependencies
        run: |
          dnf --enablerepo=powertools install -y git curl unzip xz file findutils tar which ca-certificates \
            clang cmake ninja-build gcc-c++ pkgconf-pkg-config gtk3-devel \
            gstreamer1-devel gstreamer1-plugins-base-devel \
            gstreamer1-plugins-base gstreamer1-plugins-good
      - name: Check out EchoText Rocky
        uses: actions/checkout@v4
      - name: Install Flutter stable SDK
        run: |
          git clone --depth 1 --branch 3.44.6 https://github.com/flutter/flutter.git /opt/flutter
          git config --global --add safe.directory /opt/flutter
          /opt/flutter/bin/flutter --version
      - name: Resolve Dart dependencies
        run: |
          /opt/flutter/bin/flutter config --enable-linux-desktop
          /opt/flutter/bin/flutter pub get
      - name: Static analysis
        run: /opt/flutter/bin/flutter analyze --no-fatal-infos
      - name: Unit tests
        run: /opt/flutter/bin/flutter test
      - name: Compile Rocky Linux desktop bundle
        run: /opt/flutter/bin/flutter build linux --release
      - name: Upload compiled bundle (without voice models)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: echotext-rocky8-cpu
          path: build/linux/x64/release/bundle/
